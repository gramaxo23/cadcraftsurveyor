name: Surveying toolkit checks

on:
  pull_request:
    paths:
      - "crates/survey/**"
      - "crates/engine/**"
      - "crates/ui-egui/**"
      - "crates/doc/**"
      - "crates/geom/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/surveying.yml"
  push:
    branches:
      - "feat/surveying-toolkit"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-survey-and-engine:
    name: Survey and engine tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
      - name: Test surveying and engine crates
        run: cargo test -p cadcraft-survey -p cadcraft-engine -p cadcraft-ui-egui
